<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Better Worlds – Minecraft Design Missions</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--grass:#5b8c32;--grass-d:#3f6522;--dirt:#7a5232;--dirt-d:#5a3b22;--stone:#2b2f36;--stone-2:#363b44;--panel:#1f2329;--ink:#f2f2f2;--muted:#b9c0c9;--gold:#f6c744;--diamond:#4fd1d9;--red:#e05a4f;--px:'Press Start 2P',monospace}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--stone);color:var(--ink);line-height:1.55;
background-image:linear-gradient(45deg,#2f343c 25%,transparent 25%),linear-gradient(-45deg,#2f343c 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2f343c 75%),linear-gradient(-45deg,transparent 75%,#2f343c 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
header{background:var(--grass);border-bottom:10px solid var(--dirt);box-shadow:0 6px 0 var(--dirt-d)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:18px 0}
h1{font-family:var(--px);font-size:clamp(14px,2.6vw,22px);margin:0;text-shadow:3px 3px 0 var(--grass-d);line-height:1.5}
.sub{font-weight:800;color:#eaf7d9;margin:4px 0 0}
.player{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.player input,.player select{font:inherit;padding:8px 10px;border:3px solid var(--dirt-d);background:#fffbe9;color:#222;border-radius:0}
.xp{font-family:var(--px);font-size:11px;background:var(--stone);padding:10px 12px;border:3px solid #000;color:var(--gold)}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0}
nav button{font-family:var(--px);font-size:10px;padding:10px 10px;background:var(--stone-2);color:var(--ink);border:3px solid #000;box-shadow:inset -3px -3px 0 #1a1d22,inset 3px 3px 0 #4a505b;cursor:pointer}
nav button.on{background:var(--diamond);color:#06292b;box-shadow:inset -3px -3px 0 #2a9aa1,inset 3px 3px 0 #9df0f4}
nav button.done::after{content:" ✓";color:var(--gold)}
main{padding:10px 0 60px}
.card{background:var(--panel);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:22px;margin:18px 0}
h2{font-family:var(--px);font-size:15px;line-height:1.6;color:var(--gold);margin:0 0 8px}
h3{font-family:var(--px);font-size:11px;line-height:1.6;color:var(--diamond);margin:22px 0 8px}
.tag{display:inline-block;font-size:12px;font-weight:800;background:var(--dirt);padding:2px 8px;margin:2px 6px 2px 0;border:2px solid #000}
.brief{background:#fffbe9;color:#2a2215;border:4px solid var(--dirt-d);padding:16px;font-weight:700;position:relative}
.brief::before{content:"CLIENT BRIEF";font-family:var(--px);font-size:9px;position:absolute;top:-12px;left:12px;background:var(--dirt);color:#fff;padding:4px 8px;border:2px solid #000}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{background:var(--stone-2);border:3px solid #000;padding:12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.opt b{display:block;color:var(--gold);margin-bottom:4px}
.opt.sel{outline:4px solid var(--diamond);background:#24464a}
.tier{border-left:6px solid var(--grass);background:#262b31;padding:10px 14px;margin:8px 0}
.tier.hide{display:none}
ol.steps li{margin:6px 0}
.btn{display:inline-block;font-family:var(--px);font-size:10px;padding:12px 14px;background:var(--grass);color:#fff;border:3px solid #000;box-shadow:inset -3px -3px 0 var(--grass-d),inset 3px 3px 0 #86b85a;text-decoration:none;cursor:pointer;margin:4px 6px 4px 0}
.btn.alt{background:var(--dirt);box-shadow:inset -3px -3px 0 var(--dirt-d),inset 3px 3px 0 #a07350}
.timer{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.timer span{font-size:13px;font-weight:800;background:#000;padding:4px 8px}
textarea{width:100%;min-height:70px;font:inherit;padding:10px;background:#fffbe9;color:#222;border:3px solid #000;border-radius:0;margin:4px 0 10px}
label.q{font-weight:800;display:block;margin-top:6px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--grass);margin-top:3px;flex:none}
.pts{margin-left:auto;font-family:var(--px);font-size:9px;color:var(--gold);white-space:nowrap}
.note{background:#3a2f12;border:3px solid var(--gold);padding:10px 14px;margin:12px 0}
.warn{background:#3d1d1a;border:3px solid var(--red);padding:10px 14px;margin:12px 0}
code{background:#000;color:#9df0a0;padding:2px 6px;font-size:14px}
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{border:2px solid #000;padding:8px;text-align:left;vertical-align:top;font-size:15px}
th{background:var(--dirt);}
td{background:#262b31}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:#222;font-weight:800;padding:12px 18px;border:3px solid #000;display:none;z-index:9}
a{color:var(--diamond)}
@media(max-width:600px){.card{padding:16px}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top">
  <div><h1>⛏ BUILD BETTER WORLDS</h1><p class="sub">Junior Design Agency · 8 Minecraft Education missions</p></div>
  <div class="player">
   <input id="pname" placeholder="Your name" aria-label="Your name">
   <select id="ptier" aria-label="Your level">
    <option value="rookie">Rookie – Year 7</option>
    <option value="pro">Pro – Year 8</option>
    <option value="expert">Expert – Year 9–10</option>
   </select>
   <div class="xp">XP <span id="xpTotal">0</span></div>
  </div>
 </div>
</div></header>
<div class="wrap">
 <nav id="nav"></nav>
 <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

# KSHS CAMPUS PLOTS - Minecraft Education build script (MakeCode Python)
# Builds Kelmscott SHS (from the Robot Lab campus map) with 12 fenced
# team plots. Students can only build inside their plot.
#
# HOW TO RUN (teacher, once per world):
#  1. Create a NEW world: Flat, Creative, Cheats ON. Do not host yet.
#  2. Stand on the ground (not flying). Press C -> MakeCode -> New Project.
#  3. Click the Python tab, delete everything, paste this whole file.
#  4. Click the green Play button, go back to the game, press T and type:
#         campus
#     Wait until the chat says "Campus finished" (about 2-4 minutes).
#     The school is built around world position 0,0 (Main Entry).
#     Type campus ONLY ONCE per world - running it again wipes every plot.
#  5. Next lesson: open the world, press C, click Play on this project
#     again, stand on the ground and use the commands below.
#
# OTHER CHAT COMMANDS (type in chat with T):
#   plot 3      teleport yourself to plot 3
#   gather      teleport everyone to the Main Entry
#   clear 3     wipe plot 3 back to empty grass (use between classes)
#   lock        students can only build in plots (default after build)
#   unlock      students can build anywhere (careful!)
#   walls       invisible wall around EVERY plot - students inside can't leave
#   nowalls     remove all plot walls (e.g. for the judging tour)
#   wall 3      wall around plot 3 only      nowall 3   remove it
#   (Teleport students into their plot first, e.g. /tp "Name" X -60 Z.
#    You can still walk through walls; students can't.)
#
# Map scale: 1 block is about 1.2 m. World position 0,0 is the Main Entry

  decision:{q:"Choose your strategy BEFORE you start the clock:",opts:[
   ["Plan first, then build","Spend 2 minutes thinking, then build fast."],

  steps:["Click the download button, then open the downloaded file. The Build Battle arena opens in Minecraft Education.","Choose your strategy above. When you are ready, stand on the GREEN pad.","Your secret brief appears on screen and in chat. The 20-minute countdown starts – watch the bottom of the screen.","Build inside the fence. When the screen says TIME IS UP you can no longer build.","Take 2 photos with the Camera.","Score yourself: Meets the brief /5 · Creativity /5 · Detail /5 · Use of time /5. Swap screens with a neighbour and score each other."],

{ id:"cp", nav:"Campus", title:"Campus Plots · Redesign KSHS", tags:["Team game · 3–4 lessons","Real school, real clients"],
  timer:["⏱ L1 tour + plan","⏱ L2–3 build + user test","⏱ L4 judging tour + awards"],
  world:{label:"Download Campus Plots world (play on your own)", file:"cp", name:"KSHS Campus Plots Solo.mcworld", note:"Class game? Don’t download – join your teacher’s world with the join code on the board."},
  brief:"School board client: “We have 12 empty spaces on our campus. Your design team will redesign ONE of them for real students and staff. The best designs win the KSHS Design Awards.”",
  decision:{q:"Your team (2–3) is given or chooses ONE plot:",opts:[
   ["Plot 1 \u00b7 Sports Carnival Grandstand", "Oval North \u2014 for PE department."],
   ["Plot 2 \u00b7 Outdoor Classroom", "Oval Centre \u2014 for Teachers who want lessons outside."],
   ["Plot 3 \u00b7 Shade & Water Station", "Oval South \u2014 for Athletes training in 40\u00b0C Perth summers."],
   ["Plot 4 \u00b7 Native Garden & Yarning Circle", "West Lawn \u2014 for Students and the school community."],
   ["Plot 5 \u00b7 Welcome Entry", "Front Gate Garden \u2014 for Visitors and nervous new Year 7s."],
   ["Plot 6 \u00b7 Outdoor Reading Room", "Library Courtyard \u2014 for Students who want a quiet place to read."],
   ["Plot 7 \u00b7 Lunch Chill Zone", "Central Courtyard \u2014 for Students at recess and lunch."],
   ["Plot 8 \u00b7 Youth Hub & Maker Space", "East Field \u2014 for After-school clubs (robotics, art, gaming)."],
   ["Plot 9 \u00b7 Bike & Scooter Hub", "South Field West \u2014 for Students who ride to school."],

  tiers:{rookie:"Include at least 3 of your plot’s must-haves. Add a sign that names your project.",

         expert:"All must-haves + 2 sustainable features + wheelchair access everywhere. Use a maximum of 8 block types and draw a floor plan before you build."},
  steps:["CLASS GAME: join the teacher’s world (Play → Join World → picture join code). ON YOUR OWN: click the download button and open the file. Either way you start at the Main Entry – walk onto your plot’s number pad.","Lesson 1 – Tour: walk to your plot (use the map below). Look at what’s around it: which buildings, who walks past, where is the sun and shade?","Lesson 1 – Plan: as a team, sketch your design on paper and split the jobs. Each person builds at least one feature.","Lessons 2–3 – Build inside your fence only. Halfway through, swap with another team: walk through each other’s design as the ‘client’ and give one glow and one grow.","Lesson 3 – Fix your design using the feedback. Add signs explaining your features.","Lesson 4 – Judging tour: the class visits every plot. Each team gives a 60-second pitch. Judges score out of 25.","Take photos every lesson (Camera) – before, during and finished."],
  log:["Which plot and client did your team have? What did the client NEED?","Describe one feature you built and how it helps the client.","What feedback did the other team give you, and what did you change?","What was your team’s score out of 25, and what would you improve?"],

d</b><br><small>Oval North</small></td><td>PE department</td><td>Seating for 30+, shade over the seats, a clear view of the finish line, a ramp for wheelchair users</td></tr><tr><td><b>2</b></td><td><b>Outdoor Classroom</b><br><small>Oval Centre</small></td><td>Teachers who want lessons outside</td><td>Curved seating for a class of 25, a small stage, shade, a chalkboard or sign for the lesson</td></tr><tr><td><b>3</b></td><td><b>Shade &amp; Water Station</b><br><small>Oval South</small></td><td>Athletes training in 40\u00b0C Perth summers</td><td>Shade structure, drinking water, a first-aid spot, seats to cool down</td></tr><tr><td><b>4</b></td><td><b>Native Garden &amp; Yarning Circle</b><br><small>West Lawn</small></td><td>Students and the school community</td><td>Native WA plants, a circle of seating for group talks, a path through the garden, an information sign (research the Noongar seasons respectfully)</td></tr><tr><td><b>5</b></td><td><b>Welcome Entry</b><br><small>Front Gate Garden</small></td><td>Visitors and nervous new Year 7s</td><td>A school name feature, a wheelchair-friendly path, a seat to wait on, a welcome sign</td></tr><tr><td><b>6</b></td><td><b>Outdoor Reading Room</b><br><small>Library Courtyard</small></td><td>Students who want a quiet place to read</td><td>Shade, comfy seating, a book-swap shelter, quiet zone signs</td></tr><tr><td><b>7</b></td><td><b>Lunch Chill Zone</b><br><small>Central Courtyard</small></td><td>Students at recess and lunch</td><td>Seating for 20, recycling and general bins, shade, a place to hang out in small groups</td></tr><tr><td><b>8</b></td><td><b>Youth Hub &amp; Maker Space</b><br><small>East Field</small></td><td>After-school clubs (robotics, art, gaming)</td><td>A building with a workbench area, a display wall, solar panels, an accessible entrance</td></tr><tr><td><b>9</b></td><td><b>Bike &amp; Scooter Hub</b><br><small>South Field West</small></td><td>Students who ride to school</td><td>Covered racks for 20 bikes/scooters, a repair station, a safe path to the gate, lighting</td></tr><tr><td><b>10</b></td><td><b>Community Food Garden</b><br><small>South Field East</small></td><td>Home Economics and the canteen</td><td>Garden beds, a water tank, a compost area, a tool shed</td></tr><tr><td><b>11</b></td><td><b>Quiet Sensory Space</b><br><small>Pries Lawn</small></td><td>Students who need a calm break</td><td>An enclosed calm space, plants, soft colours, comfortable seating, no loud features</td></tr><tr><td><b>12</b></td><td><b>Courts Upgrade</b><br><small>Playing Courts</small></td><td>PE classes and lunchtime sport</td><td>Shade, spectator seating, lighting for evening games, a scoreboard</td></tr></table><h3>How you are judged (out of 25)</h3><table><tr><th>Criteria</th><th>/5</th></tr><tr><td>Meets the brief \u2013 all must-haves included</td><td>5</td></tr><tr><td>Designed for the client \u2013 would they actually use it?</td><td>5</td></tr><tr><td>Sustainability \u2013 shade, water, solar, recycling, plants</td><td>5</td></tr><tr><td>Quality &amp; detail \u2013 neat, realistic, fits the school</td><td>5</td></tr><tr><td>Teamwork \u2013 everyone built, plan followed</td><td>5</td></tr></table>" },

  decision:{q:"Choose the build you’ll showcase:",opts:[
   ["My most creative build","Show originality and style."],

  tiers:{rookie:"Improve your chosen build for 20 minutes, then show it in the gallery walk.",
         pro:"Improve it, add a ‘tour’ of 3 signs, and give written feedback to 2 classmates.",

const KEY="bbw_v1";
let S={name:"",tier:"rookie",cur:"start",dec:{},log:{},xp:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}updateXP();}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",2200);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function updateXP(){let t=0;MISSIONS.forEach(m=>m.xp.forEach((x,i)=>{if(S.xp[m.id+"_"+i])t+=x[1];}));document.getElementById("xpTotal").textContent=t;
 document.querySelectorAll("nav button[data-m]").forEach(b=>{const m=MISSIONS.find(z=>z.id===b.dataset.m);if(!m)return;const done=m.xp.filter((x,i)=>S.xp[m.id+"_"+i]).length>=m.xp.length-1;b.classList.toggle("done",done);});}

function nav(){const n=document.getElementById("nav");
 const items=[["start","Start here"]].concat(MISSIONS.map((m,i)=>[m.id,m.nav||"M"+(i+1-(MISSIONS.slice(0,i).filter(z=>z.nav).length))])).concat([["teacher","🔒 Teacher"]]);
 n.innerHTML=items.map(([id,l])=>`<button data-m="${id}" class="${S.cur===id?"on":""}">${l}</button>`).join("");
 n.querySelectorAll("button").forEach(b=>b.onclick=()=>{go(b.dataset.m);});}
function go(id){S.cur=id;save();nav();render();updateXP();window.scrollTo(0,0);if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);}


const TEACHER_HASH="d1056b67471b78956ecb2ca810098393471f26cfbe8d753b7d0fd6ee792fb011";
let teacherOK=false;
try{teacherOK=sessionStorage.getItem("bbw_t")==="1";}catch(e){}
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function lockHTML(main){
 main.innerHTML=`<div class="card" style="max-width:460px;margin:30px auto;text-align:center"><h2>🔒 Teacher area</h2>
 <p>Enter the teacher code to open this tab.</p>
 <form id="lockForm"><input id="tcode" type="password" autocomplete="off" placeholder="Teacher code" style="font:inherit;padding:10px;border:3px solid #000;width:100%;max-width:280px;background:#fffbe9;color:#222;border-radius:0">
 <div><button class="btn" type="submit" style="margin-top:12px">Unlock</button></div></form>
 <p id="lockMsg" style="color:var(--red);font-weight:800;min-height:1.5em"></p>
 <p><small>Students: your missions are in M1–M8 and Campus.</small></p></div>`;
 const f=document.getElementById("lockForm"),inp=document.getElementById("tcode");inp.focus();
 f.onsubmit=async e=>{e.preventDefault();let ok=false;
  try{ok=(await sha("bbw:"+inp.value.trim().toLowerCase()))===TEACHER_HASH;}catch(err){}
  if(ok){teacherOK=true;try{sessionStorage.setItem("bbw_t","1");}catch(e2){}render();}
  else{document.getElementById("lockMsg").textContent="That code is not right. Try again.";inp.value="";inp.focus();}};
}
function render(){const main=document.getElementById("main");
 if(S.cur==="start")return main.innerHTML=startHTML();
 if(S.cur==="teacher"){if(!teacherOK)return lockHTML(main);return main.innerHTML=teacherHTML();}
 const m=MISSIONS.find(z=>z.id===S.cur);if(!m){S.cur="start";return render();}
 const n=MISSIONS.indexOf(m)+1;
 const tierRow=k=>`<div class="tier ${S.tier===k?"":"hide"}"><b>${{rookie:"Rookie (Y7)",pro:"Pro (Y8)",expert:"Expert (Y9–10)"}[k]}:</b> ${esc(m.tiers[k])}</div>`;
 const link=m.world.file?`<button class="btn" data-dl="${m.world.file}" data-name="${esc(m.world.name)}">⬇ ${esc(m.world.label)}</button>${m.world.note?`<div class="tag">${esc(m.world.note)}</div>`:""}`
   :m.world.url.startsWith("#")?`<span class="tag">No download – use a world you already built</span>`
   :`<a class="btn" href="${m.world.url}" target="_blank" rel="noopener">▶ ${esc(m.world.label)}</a>`;
 main.innerHTML=`<div class="card">
  <h2>${esc(m.title)}</h2>${m.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}
  <div class="timer">${(m.timer||["⏱ 5 min brief + decision","⏱ 35 min build","⏱ 10 min design log"]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
  <p class="brief">${esc(m.brief)}</p>
  ${link}
  ${m.extra||""}
  <h3>1 · Make your decision</h3><p>${esc(m.decision.q)}</p>
  <div class="grid">${m.decision.opts.map((o,i)=>`<button class="opt ${S.dec[m.id]===i?"sel":""}" data-i="${i}"><b>${esc(o[0])}</b>${esc(o[1])}</button>`).join("")}</div>
  <h3>2 · Your constraints</h3>${tierRow("rookie")}${tierRow("pro")}${tierRow("expert")}
  <h3>3 · Mission steps</h3><ol class="steps">${m.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
  <h3>4 · Design log</h3>${m.log.map((q,i)=>`<label class="q">${i+1}. ${esc(q)}</label><textarea data-k="${m.id}_${i}">${esc(S.log[m.id+"_"+i]||"")}</textarea>`).join("")}
  <button class="btn alt" id="copyOne">📋 Copy this mission’s log</button>
  <h3>5 · Earn your XP</h3><div class="check">${m.xp.map((x,i)=>`<label><input type="checkbox" data-x="${m.id}_${i}" ${S.xp[m.id+"_"+i]?"checked":""}><span>${esc(x[0])}</span><span class="pts">+${x[1]} XP</span></label>`).join("")}</div>
  <div class="note"><b>Evidence:</b> photos are taken with the in-game Camera and stored in your Portfolio. At the end of the lesson, screenshot your Portfolio page (Windows + Shift + S) and paste your copied Design Log into the Compass task for this mission.</div>
  ${n<8?`<button class="btn" id="next">Next mission ▶</button>`:""}
 </div>`;
 main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.dec[m.id]=+b.dataset.i;save();render();});
 main.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{S.log[t.dataset.k]=t.value;save();});
 main.querySelectorAll("input[data-x]").forEach(c=>c.onchange=()=>{S.xp[c.dataset.x]=c.checked;save();if(c.checked)toast("+XP!");});
 document.getElementById("copyOne").onclick=()=>copy(logText([m]));
 const nx=document.getElementById("next");if(nx)nx.onclick=()=>go(MISSIONS[n].id);
}
function logText(list){let t=`BUILD BETTER WORLDS – DESIGN LOG\nName: ${S.name||"(no name)"}  |  Level: ${S.tier}\nTotal XP: ${document.getElementById("xpTotal").textContent}\n`;
 list.forEach(m=>{t+=`\n=== ${m.title} ===\n`;if(S.dec[m.id]!=null)t+=`Decision: ${m.decision.opts[S.dec[m.id]][0]}\n`;
  m.log.forEach((q,i)=>{t+=`Q${i+1}. ${q}\n→ ${S.log[m.id+"_"+i]||"(not answered)"}\n`;});
  const done=m.xp.filter((x,i)=>S.xp[m.id+"_"+i]).map(x=>x[0]);t+=`Completed: ${done.join("; ")||"none ticked"}\n`;});return t;}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast("Copied! Paste it into Compass."),()=>{toast("Copy blocked – select the text and press Ctrl+C");});}

const nm=document.getElementById("pname"),tr=document.getElementById("ptier");

function dlWorld(key,name){try{const b=atob(document.getElementById("w_"+key).textContent.trim());const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([u],{type:"application/octet-stream"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
 toast("Downloaded – open the file to start Minecraft");}catch(e){toast("Download didn’t start – ask your teacher for the world file");}}
document.addEventListener("click",e=>{const d=e.target&&e.target.closest&&e.target.closest("[data-dl]");if(d)dlWorld(d.dataset.dl,d.dataset.name);if(e.target&&e.target.id==="copyAll")copy(logText(MISSIONS));if(e.target&&e.target.id==="copyScript")navigator.clipboard.writeText(document.getElementById("cpScript").textContent).then(()=>toast("Script copied – paste it into MakeCode’s Python tab"),()=>toast("Copy blocked – use the .py file instead"));});
const h=location.hash.slice(1);if(h&&(h==="start"||h==="teacher"||MISSIONS.some(m=>m.id===h)))S.cur=h;
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(k&&k!==S.cur&&(k==="start"||k==="teacher"||MISSIONS.some(m=>m.id===k)))go(k);});
