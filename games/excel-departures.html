<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Excel Departures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: airport signage shell (charcoal + signal yellow) around a paper-white spreadsheet. Mission panel left, sheet right. */
:root {
  --bg: #e9edf1; --panel: #ffffff; --ink: #121c26; --ink2: #4a5866; --line: #cdd5dc;
  --sign: #1b2530; --sign-ink: #f4f6f8; --accent: #ffc400; --accent-ink: #1b1400;
  --ok: #0c8a52; --okbg: #dcf3e7; --bad: #c4372f; --badbg: #fbe3e1; --sel: #1d5fd1; --selbg: #dce8fb;
  --grid: #dde3e8; --head: #eef1f4; --cell: #ffffff; --warn: #8a5a00; --warnbg: #fff3cf;
  --c1: #1d5fd1; --c2: #e07b00; --c3: #0c8a52; --c4: #b0359b; --c5: #0e8aa8; --c6: #7a5a2b;
  --f-disp: 'Barlow Condensed', 'Arial Narrow', sans-serif; --f-body: 'Barlow', system-ui, sans-serif; --f-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e151c; --panel: #17212b; --ink: #eef2f6; --ink2: #9fb0bf; --line: #2c3a47;
  --sign: #0a1016; --sign-ink: #f4f6f8; --accent: #ffc400; --accent-ink: #1b1400;
  --ok: #3fcf8e; --okbg: #12372a; --bad: #ff8a82; --badbg: #3d1d1b; --sel: #6ea2ff; --selbg: #1c3156;
  --grid: #2a3641; --head: #1e2a35; --cell: #131c25; --warn: #ffd166; --warnbg: #3a2f10;
  --c1: #6ea2ff; --c2: #ffa94d; --c3: #3fcf8e; --c4: #e083d0; --c5: #4cc9e6; --c6: #d1a75f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e151c; --panel: #17212b; --ink: #eef2f6; --ink2: #9fb0bf; --line: #2c3a47;
  --sign: #0a1016; --sign-ink: #f4f6f8; --accent: #ffc400; --accent-ink: #1b1400;
  --ok: #3fcf8e; --okbg: #12372a; --bad: #ff8a82; --badbg: #3d1d1b; --sel: #6ea2ff; --selbg: #1c3156;
  --grid: #2a3641; --head: #1e2a35; --cell: #131c25; --warn: #ffd166; --warnbg: #3a2f10;
  --c1: #6ea2ff; --c2: #ffa94d; --c3: #3fcf8e; --c4: #e083d0; --c5: #4cc9e6; --c6: #d1a75f; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
kbd { font-family: var(--f-mono); font-size: .82em; background: var(--head); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
.wrap { max-width: 1400px; margin: 0 auto; }

/* top sign */
.sign { background: var(--sign); color: var(--sign-ink); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--sign); z-index: 30; }
.sign-in { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.brand { font-family: var(--f-disp); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand .tag { background: var(--accent); color: var(--accent-ink); padding: 0 8px; border-radius: 4px; font-size: 20px; }
.stat { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.stat small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.stat b { font-family: var(--f-disp); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat b.yel { color: var(--accent); }
.who { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { border: 2px solid var(--ink); background: var(--panel); border-radius: 6px; padding: 6px 12px; font-weight: 600; }
.btn:hover { background: var(--head); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.ghost { background: transparent; color: var(--sign-ink); border-color: #5b6a78; }
.btn.ghost:hover { background: #2b3947; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.save-btn { animation: none; }
.save-btn.nudge { box-shadow: 0 0 0 3px var(--sign), 0 0 0 6px var(--accent); }

/* flight path */
.path { display: flex; gap: 0; margin: 14px 0 12px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.stop { flex: 1 0 96px; min-width: 96px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0 4px; color: var(--ink2); text-align: center; }
.stop::before { content: ""; position: absolute; top: 15px; left: -50%; width: 100%; height: 4px; background: var(--line); z-index: 0; }
.stop:first-child::before { display: none; }
.stop.done::before, .stop.cur::before { background: var(--ok); }
.dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-disp); font-weight: 700; font-size: 18px; background: var(--panel); border: 3px solid var(--line); position: relative; z-index: 1; color: var(--ink2); }
.stop.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.stop.cur .dot { background: var(--accent); border-color: var(--ink); color: var(--accent-ink); transform: scale(1.12); }
.stop.locked { opacity: .55; cursor: not-allowed; }
.stop .nm { font-weight: 600; font-size: 13px; line-height: 1.15; color: var(--ink); }
.stop .sk { font-size: 11.5px; line-height: 1.15; }
.stop .ex { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--warn); }

/* main */
.main { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.mission h2 { font-family: var(--f-disp); font-size: 30px; line-height: 1; margin: 2px 0 2px; text-transform: uppercase; text-wrap: balance; }
.kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--ink2); }
.bar { height: 10px; background: var(--head); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); margin: 8px 0 2px; }
.bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .4s; }
.barlab { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.story { margin: 10px 0; }
.tipbox { background: var(--selbg); border-radius: 8px; padding: 9px 11px; font-size: 14px; margin: 8px 0 12px; }
.tipbox b { font-family: var(--f-mono); font-size: .9em; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.task { border: 2px solid var(--line); border-radius: 8px; padding: 9px 10px; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 9px; background: var(--panel); }
.task .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; border: 2px solid var(--line); color: var(--ink2); }
.task h3 { margin: 0; font-size: 15px; line-height: 1.25; }
.task p { margin: 2px 0 0; font-size: 14px; color: var(--ink2); }
.task.ok { border-color: var(--ok); background: var(--okbg); }
.task.ok .ic { background: var(--ok); border-color: var(--ok); color: #fff; }
.task.no { border-color: var(--bad); background: var(--badbg); }
.task.no .ic { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.task .msg { grid-column: 2; font-size: 14px; font-weight: 600; color: var(--bad); }
.task .pts { grid-column: 2; font-size: 12.5px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.task .hintbtn { background: none; border: 0; padding: 0; text-decoration: underline; font-size: 13px; color: var(--sel); }
.task .hint { grid-column: 2; background: var(--warnbg); color: var(--ink); border-radius: 6px; padding: 6px 9px; font-size: 14px; }
.checkrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.checkrow .btn { flex: 1 1 auto; font-size: 16px; padding: 9px 14px; }
.status { margin-top: 10px; font-size: 14px; border-radius: 8px; padding: 8px 10px; background: var(--head); }
.status.good { background: var(--okbg); }
.status.bad { background: var(--badbg); }

/* sheet */
.sheetbox { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; }
.tb { min-width: 34px; height: 32px; padding: 0 9px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; font-weight: 700; }
.tb:hover { background: var(--head); }
.tb[aria-pressed="true"] { background: var(--selbg); border-color: var(--sel); }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
.sw { width: 22px; height: 22px; border-radius: 4px; border: 2px solid var(--line); padding: 0; }
.sw.none { background: linear-gradient(135deg, transparent 45%, var(--bad) 45% 55%, transparent 55%), var(--cell); }
.fbar { display: flex; gap: 6px; align-items: center; }
.namebox { width: 84px; height: 32px; text-align: center; font-family: var(--f-mono); font-size: 13px; border: 1px solid var(--line); border-radius: 6px; background: var(--cell); }
.fx { font-family: var(--f-mono); font-weight: 700; color: var(--ink2); font-style: italic; }
.fin { flex: 1; min-width: 0; height: 32px; font-family: var(--f-mono); font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--cell); }
.errline { min-height: 0; font-size: 13.5px; background: var(--badbg); color: var(--ink); border-radius: 6px; padding: 5px 9px; }
.gridscroll { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--cell); max-height: 560px; }
#gridwrap { outline: none; }
.grid { position: relative; display: grid; width: max-content; font-size: 14.5px; user-select: none; -webkit-user-select: none; }
.hc, .rc { background: var(--head); color: var(--ink2); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); position: sticky; z-index: 3; }
.hc { top: 0; height: 24px; }
.rc { left: 0; min-width: 38px; }
.corner { top: 0; left: 0; z-index: 4; }
.hc.hl, .rc.hl { background: var(--selbg); color: var(--sel); }
.c { height: 26px; padding: 0 6px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); background: var(--cell); white-space: nowrap; overflow: hidden; text-overflow: clip; display: flex; align-items: center; font-variant-numeric: tabular-nums; cursor: cell; min-width: 0; }
.c.n { justify-content: flex-end; } .c.e { justify-content: center; color: var(--bad); font-weight: 700; } .c.b { justify-content: center; }
.c.bold { font-weight: 700; }
.c.insel { background-image: linear-gradient(var(--selbg), var(--selbg)); background-blend-mode: multiply; }
.c.ref { outline: 2px dashed var(--c2); outline-offset: -2px; }
.selbox { position: absolute; border: 2px solid var(--sel); background: color-mix(in srgb, var(--sel) 13%, transparent); pointer-events: none; z-index: 2; }
.fillh { position: absolute; width: 10px; height: 10px; background: var(--sel); border: 1px solid var(--cell); cursor: crosshair; z-index: 5; }
.fillprev { position: absolute; border: 2px dashed var(--sel); pointer-events: none; z-index: 2; }
.cellin { position: absolute; z-index: 6; border: 2px solid var(--sel); background: var(--cell); padding: 0 5px; font-family: var(--f-body); font-size: 14.5px; outline: none; height: 26px; }
.hintline { font-size: 13px; color: var(--ink2); }

/* charts */
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.chartcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.chartcard .ch-h { display: flex; gap: 6px; align-items: center; }
.chartcard input { flex: 1; min-width: 0; font-weight: 700; border: 1px dashed var(--line); background: transparent; border-radius: 4px; padding: 3px 6px; }
.chartcard svg { width: 100%; height: auto; display: block; }
.chartcard text { fill: var(--ink); font-family: var(--f-body); }
.chartcard .rng { font-size: 12px; color: var(--ink2); }

/* dialogs */
.veil { position: fixed; inset: 0; background: rgba(8, 14, 20, .62); z-index: 50; display: grid; place-items: center; padding: 16px; overflow: auto; }
.dlg { background: var(--panel); border-radius: 12px; border: 1px solid var(--line); width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px; }
.dlg.wide { width: min(860px, 100%); }
.dlg h2 { font-family: var(--f-disp); text-transform: uppercase; font-size: 32px; margin: 0 0 6px; line-height: 1; }
.dlg label { display: block; font-weight: 600; margin: 10px 0 4px; }
.dlg input[type=text], .dlg select, .dlg textarea { width: 100%; border: 2px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--cell); }
.dlg textarea { font-family: var(--f-mono); font-size: 12px; min-height: 90px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.dests { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.dest { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; }
.dest[aria-checked="true"] { border-color: var(--ink); background: var(--accent); color: var(--accent-ink); }
.dest .code { font-family: var(--f-disp); font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: .04em; }
.dest small { display: block; opacity: .8; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th, .table td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.verify { padding: 6px 10px; border-radius: 6px; font-weight: 600; margin: 8px 0; }
.verify.ok { background: var(--okbg); } .verify.no { background: var(--warnbg); }
.stamp { display: inline-block; font-family: var(--f-disp); font-weight: 700; font-size: 40px; text-transform: uppercase; color: var(--ok); border: 5px double var(--ok); border-radius: 10px; padding: 2px 16px; transform: rotate(-6deg); letter-spacing: .06em; animation: slam .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes slam { from { transform: rotate(-6deg) scale(2.4); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } .bar i { transition: none; } }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--sign); color: var(--sign-ink); padding: 10px 16px; border-radius: 8px; z-index: 70; font-weight: 600; max-width: calc(100vw - 32px); border-left: 6px solid var(--accent); }
.small { font-size: 13px; color: var(--ink2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* lessons */
.banner { width: 100%; height: auto; display: block; margin: 10px 0 8px; border-radius: 10px; }
.tabs { display: flex; gap: 6px; margin: 6px 0 10px; }
.tab { flex: 1; border: 2px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 8px; font-weight: 700; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tab:disabled { opacity: .5; cursor: not-allowed; }
.dots { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.dots span { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.dots span.done { background: var(--ok); } .dots span.cur { background: var(--accent); outline: 1px solid var(--ink); }
.dots small { margin-left: auto; color: var(--ink2); font-size: 12.5px; }
.lt { font-family: var(--f-disp); text-transform: uppercase; font-size: 24px; margin: 4px 0; line-height: 1.05; }
.lbody { font-size: 15px; margin: 4px 0 8px; }
.lbody ul, .lbody ol { margin: 6px 0 6px 18px; padding: 0; } .lbody li { margin: 3px 0; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--head); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.cap { font-size: 13.5px; color: var(--ink2); margin: 4px 0 8px; }
.miniwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.mini { border-collapse: collapse; font-size: 13px; width: 100%; background: var(--cell); }
.mini th { background: var(--head); color: var(--ink2); font-size: 11px; font-weight: 600; padding: 2px 6px; border: 1px solid var(--grid); }
.mini td { border: 1px solid var(--grid); padding: 3px 6px; min-width: 64px; height: 28px; vertical-align: top; white-space: nowrap; }
.mini td.n { text-align: right; } .mini td.bold { font-weight: 700; }
.mini td.hl { outline: 2px solid var(--sel); outline-offset: -2px; background: var(--selbg); color: var(--ink); }
.mini .mf { display: block; font-size: 10.5px; color: var(--ink2); background: none; border: 0; padding: 0; white-space: nowrap; }
.mini td.tgt { background: #fff3b0; padding: 2px; } .mini td.tgt input { width: 100%; min-width: 120px; border: 2px solid var(--sel); border-radius: 4px; font-family: var(--f-mono); font-size: 13px; padding: 3px 5px; background: #fffdf0; color: #121c26; }
.tryout { margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: var(--head); font-size: 14px; }
.tryout.ok { background: var(--okbg); } .tryout.no { background: var(--badbg); }
.qz { border: 2px solid var(--line); border-radius: 8px; margin: 8px 0; padding: 6px 10px 8px; min-width: 0; }
.qz legend { font-weight: 700; padding: 0 4px; } .qz.good { border-color: var(--ok); background: var(--okbg); } .qz.bad { border-color: var(--bad); background: var(--badbg); }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; cursor: pointer; } .opt input { margin-top: 4px; }
.qfb { font-size: 13.5px; margin-top: 4px; }
.lnav { justify-content: space-between; }

</style>
<div id="app" hidden>
<header class="sign"><div class="sign-in">
  <div class="brand"><span class="tag">XL</span> Excel Departures</div>

  <div class="stat"><small>Route</small><b id="hRoute"></b></div>
  <div class="stat"><small>Mission</small><b id="hMission"></b></div>
  <div class="stat"><small>Passport stamps</small><b id="hStamps"></b></div>
  <div class="stat"><small>Score</small><b id="hScore" class="yel"></b></div>
  <div class="stat"><small>Rank</small><b id="hRank"></b></div>
  <div class="stat" style="align-items:flex-start"><button class="btn primary save-btn" id="saveBtn">Save / hand in</button><small id="saveNote" style="margin-top:3px;text-transform:none;letter-spacing:0"></small></div>
  <button class="btn ghost" id="reportBtn">Progress report</button>
  <button class="btn ghost" id="openBtn">Open saved work</button>
</div></header>
<div class="wrap">
<nav id="path" class="path" aria-label="Missions"></nav>
<div class="main">

  <section class="sheetbox" aria-label="Spreadsheet">
    <div class="toolbar" role="toolbar" aria-label="Formatting">

      <button class="tb" id="tbBold" title="Bold (Ctrl+B)" aria-label="Bold" style="font-weight:800">B</button>
      <button class="tb" id="tbCur" title="Currency format" aria-label="Currency format">$</button>
      <button class="tb" id="tbPct" title="Percent format" aria-label="Percent format">%</button>
      <span class="sep"></span><span id="swatches" style="display:flex;gap:4px;align-items:center" role="group" aria-label="Fill colour"></span><span class="sep"></span>
      <button class="tb" id="tbFillD" title="Fill down (Ctrl+D)">Fill &darr;</button>

  L.tasks.forEach(t => {

/* ===== Mission panel: banner, Learn it / Do it tabs, lesson cards, try-it box, quiz ===== */
function miniTable(ex, target) {
  const cells = { ...ex.cells }, fm = ex.fmts || {}, hl = new Set(ex.hl || []);
  const sh = createSheet(target ? { ...cells, [target]: '' } : cells); let mc = 0, mr = 0;
  Object.keys(cells).concat(target ? [target] : []).forEach(a => { const p = parseA1(a); mc = Math.max(mc, p.c); mr = Math.max(mr, p.r); });
  let h = '<div class="miniwrap"><table class="mini"><thead><tr><th></th>';
  for (let c = 0; c <= mc; c++) h += `<th>${colL(c)}</th>`;
  h += '</tr></thead><tbody>';
  for (let r = 0; r <= mr; r++) {
    h += `<tr><th>${r + 1}</th>`;
    for (let c = 0; c <= mc; c++) {
      const a = A1(c, r), raw = cells[a], f = fm[a] || {}, v = sh.val(a);
      if (target && a === target) { h += `<td class="tgt"><input id="tryIn" type="text" spellcheck="false" autocomplete="off" aria-label="Type your formula for ${a}" placeholder="type here"></td>`; continue; }
      const isF = typeof raw === 'string' && raw[0] === '=';
      h += `<td class="${typeof v === 'number' ? 'n' : ''}${hl.has(a) ? ' hl' : ''}${f.b ? ' bold' : ''}"${f.fill ? ` style="background:${f.fill};color:#121c26"` : ''}>${esc(fmtVal(v, f))}${isF ? `<code class="mf">${esc(raw)}</code>` : ''}</td>`;
    }
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}

function renderLearn() {
  const L = curLevel(), st = LS(), lr = st.learn, les = LESSONS[L.id], host = $('#learnbody');

  let h = `<div class="dots" aria-label="Lesson progress">${Array.from({ length: total }, (_, i) => `<span class="${i === s ? 'cur' : i < s ? 'done' : ''}"></span>`).join('')}<small>Step ${s + 1} of ${total}</small></div>`;
  const isTry = hasTry && s === nc, isQuiz = s === total - 1;
  if (s < nc) {

    if (c.ex) h += miniTable(c.ex) + `<p class="cap">${c.ex.cap}</p>`;
  } else if (isTry) {
    const t = les.try; h += `<h3 class="lt">Your turn: try it here</h3><p class="lbody">${t.prompt}</p>${miniTable({ cells: t.cells }, t.target)}<div id="tryOut" class="tryout" role="status">Type your formula in the yellow cell.</div><div class="row" style="margin-top:6px"><button class="btn" id="tryShow">Show me the answer</button></div>`;
  } else if (lr.passed) {
    h += `<div class="stamp" style="font-size:28px">Lesson passed</div><p class="lbody" style="margin-top:12px">You earned ${LESSON_PTS} points. Now use what you learned on the sheet. You can come back to this lesson any time.</p><div class="row"><button class="btn primary" id="goDo">Start the tasks →</button></div>`;
  } else {
    h += `<h3 class="lt">Quick quiz</h3><p class="lbody">Answer all three to unlock the tasks. You can try as many times as you like.</p>`;
    les.quiz.forEach((q, i) => { h += `<fieldset class="qz" data-q="${i}"><legend>${i + 1}. ${esc(q.q)}</legend>${q.o.map((o, j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}"> <span>${esc(o)}</span></label>`).join('')}<div class="qfb" role="status"></div></fieldset>`; });
    h += `<div class="row"><button class="btn primary" id="qCheck">Check answers</button></div><p id="qMsg" class="small" role="status"></p>`;
  }
  h += `<div class="row lnav"><button class="btn" id="lBack" ${s === 0 ? 'disabled' : ''}>← Back</button>${isQuiz ? '' : `<button class="btn primary" id="lNext" ${isTry && !lr.tried ? 'disabled' : ''}>${isTry ? 'Next →' : s === total - 2 ? 'On to the quiz →' : 'Next →'}</button>`}</div>`;
  host.innerHTML = h;
  $('#lBack').onclick = () => { lr.step = s - 1; renderLearn(); }; const nx = $('#lNext'); if (nx) nx.onclick = () => { lr.step = s + 1; changed(); renderLearn(); };
  if (isTry) wireTry(les.try, lr);
  const gd = $('#goDo'); if (gd) gd.onclick = () => { lr.view = 'do'; renderMission(); };
  const qc = $('#qCheck'); if (qc) qc.onclick = () => {
    let ok = 0, blank = 0;
    les.quiz.forEach((q, i) => { const fs = host.querySelector(`[data-q="${i}"]`), sel = fs.querySelector('input:checked'), fb = fs.querySelector('.qfb'); fs.classList.remove('good', 'bad');
      if (!sel) { blank++; fb.textContent = 'Pick an answer.'; return; }
      if (+sel.value === q.a) { ok++; fs.classList.add('good'); fb.textContent = '✓ ' + q.why; } else { fs.classList.add('bad'); fb.textContent = '✕ Not quite. Have another look at the lesson cards and try again.'; } });
    const m = $('#qMsg');
    if (ok === les.quiz.length) { if (!lr.passed) { lr.passed = true; lr.pts = LESSON_PTS; changed(); updateHeader(); toast(`Lesson passed! +${LESSON_PTS} points.`); } renderMission(); }
    else m.textContent = blank ? 'Answer every question, then check again.' : `${ok} of ${les.quiz.length} right. Fix the red ones and check again.`;
  };
}
function wireTry(t, lr) {
  const inp = $('#tryIn'), out = $('#tryOut'), nx = $('#lNext');
  const go = () => {
    const v = inp.value; if (!v.trim()) { out.className = 'tryout'; out.textContent = 'Type your formula in the yellow cell.'; return; }
    const sh = createSheet({ ...t.cells, [t.target]: v }), c = mkCtx(sh, {}, { charts: [], log: [] }, D), r = chk(c, t.target, t.expect, { fn: t.fn, has: t.has });
    if (r === true) { out.className = 'tryout ok'; out.innerHTML = `<b>Correct!</b> ${t.target} shows ${esc(fmtVal(sh.val(t.target), {}))}.`; if (!lr.tried) { lr.tried = true; changed(); } nx.disabled = false; }
    else { out.className = 'tryout no'; out.textContent = r; nx.disabled = !lr.tried; }
  };
  inp.oninput = go; inp.addEventListener('keydown', e => e.stopPropagation()); $('#tryShow').onclick = () => { inp.value = t.sol; go(); };
  if (lr.tried) { out.className = 'tryout ok'; out.textContent = 'You already did this one. Try it again if you like.'; }
}

</script>
